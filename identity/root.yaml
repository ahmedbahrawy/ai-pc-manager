# Project Identity
name: "AI PC Manager"
purpose: "AI-powered PC management and optimization platform"
description: "A comprehensive solution for managing and optimizing PC performance using AI"

# Application Type and Requirements
application:
  type: "web"
  framework: "Next.js"
  category: "System Tools"
  target_platforms:
    - "Windows"
    - "macOS"
    - "Linux"

# System Requirements
system:
  hardware:
    minimum_memory: "4GB RAM"
    recommended_memory: "8GB RAM"
    disk_space: "1GB"
  software:
    runtime:
      - name: "Node.js"
        version: ">=18.0.0"
        install_guide: "https://nodejs.org/en/download/"
    dependencies:
      - name: "npm"
        version: ">=9.0.0"

# Environment Setup
environment:
  development:
    setup_steps:
      - description: "Install dependencies"
        command: "npm install"
      - description: "Start development server"
        command: "npm run dev"
    configuration:
      env_file: ".env.local"
      required_variables:
        - "NEXT_PUBLIC_APP_URL"
        - "NEXT_PUBLIC_APP_ENV"
        - "NEXT_PUBLIC_API_URL"
        - "DATABASE_URL"
        - "NEXT_PUBLIC_FEATURE_FLAGS"
  production:
    setup_steps:
      - description: "Install production dependencies"
        command: "npm ci"
      - description: "Build application"
        command: "npm run build"
    configuration:
      env_file: ".env.production"
      required_variables:
        - "NEXT_PUBLIC_APP_URL"
        - "NEXT_PUBLIC_APP_NAME"
        - "NEXT_PUBLIC_GOOGLE_ANALYTICS_ID"
        - "NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION"
        - "API_KEY"
        - "API_SECRET"
        - "NEXT_PUBLIC_CDN_URL"
        - "CACHE_TTL"
        - "NEXT_PUBLIC_ENABLE_ANALYTICS"
        - "NEXT_PUBLIC_ENABLE_ERROR_REPORTING"
        - "NEXT_PUBLIC_FEATURE_FLAGS"
      optional_variables:
        - "NEXT_PUBLIC_CSP_DOMAINS"
        - "DATABASE_URL"

# Runtime and Technical Details
runtime:
  environment: "Node.js v18+"
  requirements:
    - "TypeScript 5.0 or higher"
    - "npm or yarn package manager"
    - "Git for version control"

# Project Structure
structure:
  rootFolder:
    name: "app"
    purpose: "Contains all Next.js application code"
    contents: "Pages, components, and API routes"
    subfolders:
      - name: "components"
        purpose: "UI components organized by atomic design"
        contents: "Atoms, molecules, organisms, and features"
      - name: "lib"
        purpose: "Shared utilities and helpers"
        contents: "Utility functions and constants"
  conventions:
    - "Feature-based directory organization"
    - "Component-driven architecture"
    - "Atomic design principles"
  specialFolders:
    - path: "app/components"
      description: "Reusable UI components"
      purpose: "Store and organize reusable UI components following atomic design principles"
    - path: "app/features"
      description: "Feature-specific implementations"
      purpose: "Contain isolated feature implementations with their own components and logic"
    - path: "app/views"
      description: "Page-level components"
      purpose: "Handle page-level component composition and layout management"

# Usage and Setup
usage:
  prerequisites:
    - package: "next"
      version: "14.0.3"
      details: "Core Next.js framework"
    - package: "react"
      version: "^18"
      details: "React library"
  setup:
    instructions: "Run npm install and npm run dev"
    tools:
      - "Node.js v18 or higher"
      - "npm v9 or higher"
  commands:
    - description: "Start development server"
      usage: "npm run dev"
      environment: "development"
    - description: "Build for production"
      usage: "npm run build"
      environment: "production"
    - description: "Start production server"
      usage: "npm start"
      environment: "production"

# Documentation
documentation:
  references:
    - url: "https://github.com/ahmedbahrawy/ai-pc-manager"
      description: "Main repository"
      type: "source"

goals:
  - "Implement core features"
  - "Ensure responsive design"
  - "Optimize performance"
summary: "Setting up Next.js 13+ project structure"
nextSteps:
  - "Create basic layout"
  - "Set up routing"
  - "Implement core components"
progress:
  percentage: 10
  summary: "Initial project setup"
completed: false 