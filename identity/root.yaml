# Project Identity
name: "AI-Driven Business Solutions"
purpose: "Empowering businesses with AI-driven solutions and strategic enhancements"
description: "Next.js application providing AI-driven business solutions, consultation, and micro-apps"

# Application Type and Requirements
application:
  type: "web"
  framework: "Next.js"
  category: "Business Solutions"
  target_platforms:
    - "Web Browsers"
    - "Progressive Web App"

# System Requirements
system:
  hardware:
    minimum_memory: "4GB RAM"
    recommended_memory: "8GB RAM"
    disk_space: "1GB"
  software:
    runtime:
      - name: "Node.js"
        version: ">=18.0.0"
        install_guide: "https://nodejs.org/en/download/"
    dependencies:
      - name: "npm"
        version: ">=9.0.0"

# Environment Setup
environment:
  development:
    setup_steps:
      - description: "Install dependencies"
        command: "npm install"
      - description: "Start development server"
        command: "npm run dev"
    configuration:
      env_file: ".env.local"
      required_variables:
        - "NEXT_PUBLIC_APP_URL"
        - "NEXT_PUBLIC_APP_ENV"
        - "NEXT_PUBLIC_API_URL"
        - "DATABASE_URL"
        - "NEXT_PUBLIC_FEATURE_FLAGS"
  production:
    setup_steps:
      - description: "Install production dependencies"
        command: "npm ci"
      - description: "Build application"
        command: "npm run build"
    configuration:
      env_file: ".env.production"
      required_variables:
        - "NEXT_PUBLIC_APP_URL"
        - "NEXT_PUBLIC_APP_ENV"
        - "NEXT_PUBLIC_API_URL"
        - "NEXT_PUBLIC_GA_TRACKING_ID"
        - "NEXT_PUBLIC_FEATURE_FLAGS"
        - "NEXT_PUBLIC_CACHE_MAX_AGE"
        - "NEXT_PUBLIC_CDN_URL"
        - "NEXT_PUBLIC_CSP_DOMAINS"
        - "DATABASE_URL"

# Runtime and Technical Details
runtime:
  environment: "Node.js v18+"
  requirements:
    - "TypeScript 5.0 or higher"
    - "npm package manager"
    - "Git for version control"

# Project Structure
structure:
  rootFolder:
    name: "app"
    purpose: "Contains all Next.js application code"
    contents: "Pages, components, and API routes"
    subfolders:
      - name: "components"
        purpose: "UI components organized by atomic design"
        contents: "Atoms, molecules, organisms, and features"
      - name: "lib"
        purpose: "Shared utilities and helpers"
        contents: "Utility functions and constants"
  conventions:
    - "Atomic Design Pattern for components"
    - "Feature-first organization"
    - "Type-safe throughout"
  specialFolders:
    - path: "app/components/atoms"
      description: "Basic building blocks"
      purpose: "Fundamental UI components"
    - path: "app/components/molecules"
      description: "Combinations of atoms"
      purpose: "Composite components"
    - path: "app/components/organisms"
      description: "Complex components"
      purpose: "Full-featured UI sections"
    - path: "app/components/features"
      description: "Feature-specific components"
      purpose: "Components tied to specific features"

# Usage and Setup
usage:
  prerequisites:
    - package: "next"
      version: "14.0.3"
      details: "Core Next.js framework"
    - package: "react"
      version: "^18"
      details: "React library"
  setup:
    instructions: "Run npm install and npm run dev"
    tools:
      - "Node.js v18 or higher"
      - "npm v9 or higher"
  commands:
    - description: "Start development server"
      usage: "npm run dev"
      environment: "development"
    - description: "Build for production"
      usage: "npm run build"
      environment: "production"
    - description: "Start production server"
      usage: "npm start"
      environment: "production"

# Documentation
documentation:
  references:
    - url: "https://nextjs.org/docs"
      description: "Next.js Documentation"
      type: "framework"
    - url: "https://tailwindcss.com/docs"
      description: "Tailwind CSS Documentation"
      type: "styling"

goals:
  - "Implement core features"
  - "Ensure responsive design"
  - "Optimize performance"
summary: "Setting up Next.js 13+ project structure"
nextSteps:
  - "Create basic layout"
  - "Set up routing"
  - "Implement core components"
progress:
  percentage: 10
  summary: "Initial project setup"
completed: false 